<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in - KMart</title>
<meta name="description" content="KMart - the campus store. Browse products online and collect them at the counter.">
<link rel="icon" href="/assets/images/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="/css/style.css" rel="stylesheet">
</head>
<body data-page="login">
<a class="skip-link" href="#main">Skip to main content</a>
<div id="navbar"></div>
<main id="main" class="container py-4 py-lg-5">
<div class="card auth-card"><div class="card-body p-4">
<h1 class="h3 mb-1">Log in</h1>
<p class="text-muted">Welcome back. Log in to place and track orders.</p>
<div id="form-alert" aria-live="polite"></div>
<form id="login-form" novalidate>
<div class="mb-3"><label for="email" class="form-label">Email</label><input type="email" id="email" name="email" class="form-control" required autocomplete="email"><div class="invalid-feedback" data-error-for="email"></div></div><div class="mb-3"><label for="password" class="form-label">Password</label><input type="password" id="password" name="password" class="form-control" required autocomplete="current-password"><div class="invalid-feedback" data-error-for="password"></div></div>
<button type="submit" class="btn btn-primary w-100 mt-2">Log in</button>
</form>
<p class="mt-3 mb-0 text-center">New here? <a href="/register.html">Create an account</a></p>
</div></div>
</main>

<div id="footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/common.js"></script>
<script src="/js/cart.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
