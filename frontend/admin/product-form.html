<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product form - KMart</title>
<meta name="description" content="KMart - the campus store. Browse products online and collect them at the counter.">
<link rel="icon" href="/assets/images/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="/css/style.css" rel="stylesheet">
</head>
<body data-page="admin-products" data-admin>
<a class="skip-link" href="#main">Skip to main content</a>
<div id="navbar"></div>
<main id="main" class="container py-4 py-lg-5">
<nav aria-label="Breadcrumb"><ol class="breadcrumb"><li class="breadcrumb-item"><a href="/admin/products.html">Products</a></li><li class="breadcrumb-item active" aria-current="page">Product form</li></ol></nav>
<h1 id="form-title" class="page-title mb-4">Add product</h1>
<div id="form-state"></div>
<div id="form-alert" aria-live="polite"></div>
<form id="product-form" novalidate>
<div class="row g-4">
  <div class="col-lg-8"><div class="card"><div class="card-body">
    <div class="mb-3"><label for="name" class="form-label">Name</label><input id="name" name="name" class="form-control" maxlength="100" required><div class="invalid-feedback" data-error-for="name"></div></div>
    <div class="mb-3"><label for="description" class="form-label">Description</label><textarea id="description" name="description" class="form-control" rows="4" maxlength="1000"></textarea><div class="invalid-feedback" data-error-for="description"></div></div>
    <div class="row g-3">
      <div class="col-md-4"><label for="category" class="form-label">Category</label><select id="category" name="category" class="form-select" required><option value="">Choose...</option></select><div class="invalid-feedback" data-error-for="category"></div></div>
      <div class="col-md-4"><label for="price" class="form-label">Price (&#8377;)</label><input type="number" id="price" name="price" class="form-control" min="0.01" max="100000" step="0.01" required><div class="invalid-feedback" data-error-for="price"></div></div>
      <div class="col-md-4"><label for="stock" class="form-label">Stock</label><input type="number" id="stock" name="stock" class="form-control" min="0" step="1" required><div class="invalid-feedback" data-error-for="stock"></div></div>
    </div>
    <div class="mt-3"><label for="imageUrl" class="form-label">Image URL</label><input id="imageUrl" name="imageUrl" class="form-control" maxlength="500" placeholder="https://... or /assets/images/products/name.svg"><div class="form-text">Optional. If the image cannot load, a placeholder is shown.</div><div class="invalid-feedback" data-error-for="imageUrl"></div></div>
    <div class="form-check form-switch mt-3"><input class="form-check-input" type="checkbox" role="switch" id="isActive" name="isActive" checked><label class="form-check-label" for="isActive">Active (visible to students)</label></div>
    <div class="form-check form-switch mt-2"><input class="form-check-input" type="checkbox" role="switch" id="isFeatured" name="isFeatured"><label class="form-check-label" for="isFeatured">Featured on the homepage</label></div>
  </div></div>
  <div class="mt-3 d-flex gap-2"><button type="submit" class="btn btn-primary">Save product</button><a href="/admin/products.html" class="btn btn-outline-secondary">Cancel</a></div></div>
  <div class="col-lg-4"><div class="card"><div class="card-body"><h2 class="h6">Image preview</h2><div id="image-preview" class="text-muted small">Enter an image URL to preview it.</div></div></div></div>
</div>
</form>
</main>

<div id="footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/common.js"></script>
<script src="/js/cart.js"></script>
<script src="/js/admin/product-form.js"></script>
</body>
</html>
