<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manage orders - KMart</title>
<meta name="description" content="KMart - the campus store. Browse products online and collect them at the counter.">
<link rel="icon" href="/assets/images/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="/css/style.css" rel="stylesheet">
</head>
<body data-page="admin-orders" data-admin>
<a class="skip-link" href="#main">Skip to main content</a>
<div id="navbar"></div>
<main id="main" class="container py-4 py-lg-5">
<h1 class="page-title mb-4">Orders</h1>

<form id="filter-form" class="filter-bar mb-3" role="search" aria-label="Filter orders">
  <div class="row g-3 align-items-end">
    <div class="col-12 col-md-6"><label for="q" class="form-label">Search by order number, student name or email</label><input type="search" id="q" name="q" class="form-control" maxlength="100" autocomplete="off"></div>
    <div class="col-12 col-md-4"><label for="status" class="form-label">Status</label><select id="status" name="status" class="form-select"><option value="">All statuses</option><option>Pending</option><option>Confirmed</option><option>Ready for Pickup</option><option>Completed</option><option>Cancelled</option></select></div>
  </div>
</form>
<div id="order-table"></div><div id="pager" class="mt-4"></div>
</main>

<div id="footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/common.js"></script>
<script src="/js/cart.js"></script>
<script src="/js/admin/orders.js"></script>
</body>
</html>
