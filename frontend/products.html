<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Products - KMart</title>
<meta name="description" content="KMart - the campus store. Browse products online and collect them at the counter.">
<link rel="icon" href="/assets/images/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="/css/style.css" rel="stylesheet">
</head>
<body data-page="products">
<a class="skip-link" href="#main">Skip to main content</a>
<div id="navbar"></div>
<main id="main" class="container py-4 py-lg-5">
<h1 class="page-title mb-4">Products</h1>

<form id="filter-form" class="filter-bar mb-3" role="search" aria-label="Filter products">
  <div class="row g-3 align-items-end">
    <div class="col-12 col-md-6 col-lg-3"><label for="search" class="form-label">Search by name</label><input type="search" id="search" name="search" class="form-control" placeholder="e.g. notebook" maxlength="100" autocomplete="off"></div>
    <div class="col-6 col-md-3 col-lg-2"><label for="category" class="form-label">Category</label><select id="category" name="category" class="form-select"><option value="">All categories</option></select></div>
    <div class="col-3 col-md-2 col-lg-1"><label for="minPrice" class="form-label">Min &#8377;</label><input type="number" id="minPrice" name="minPrice" class="form-control" min="0" step="1"></div>
    <div class="col-3 col-md-2 col-lg-1"><label for="maxPrice" class="form-label">Max &#8377;</label><input type="number" id="maxPrice" name="maxPrice" class="form-control" min="0" step="1"></div>
    <div class="col-6 col-md-3 col-lg-2"><label for="sort" class="form-label">Sort by</label><select id="sort" name="sort" class="form-select"><option value="name_asc">Name: A to Z</option><option value="name_desc">Name: Z to A</option><option value="price_asc">Price: low to high</option><option value="price_desc">Price: high to low</option><option value="newest">Newest first</option></select></div>
    <div class="col-12 col-lg-3 d-flex align-items-center justify-content-between gap-3">
      <div class="form-check"><input class="form-check-input" type="checkbox" id="inStock" name="inStock"><label class="form-check-label" for="inStock">In stock only</label></div>
      <button type="button" id="clear-filters" class="btn btn-outline-secondary btn-sm">Clear filters</button>
    </div>
  </div>
</form>
<p id="result-count" class="text-muted small" aria-live="polite"></p>
<div id="product-grid"></div>
<div id="pager" class="mt-4"></div>
</main>

<div id="footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/common.js"></script>
<script src="/js/cart.js"></script>
<script src="/js/products.js"></script>
</body>
</html>
